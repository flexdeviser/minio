name: Release

on:
  push:
    tags:
      - "RELEASE.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. RELEASE.2026-10-10T12-00-00Z)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Resolve tag and RFC3339 version
        id: vars
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]; then
            echo "::error::Tag '$TAG' is not a valid RELEASE.YYYY-MM-DDTHH-MM-SSZ tag"
            exit 1
          fi
          VERSION="$(echo "${TAG#RELEASE.}" | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2})-([0-9]{2})-([0-9]{2})Z$/\1:\2:\3Z/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          check-latest: true
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # gen-ldflags must run on the host, not for the target GOOS/GOARCH,
          # otherwise go run tries to execute a cross-compiled binary.
          LDFLAGS="$(MINIO_RELEASE=RELEASE \
            MINIO_COMMIT_ID="${GITHUB_SHA}" \
            MINIO_COMMIT_TIME="$(git log -1 --format=%cI)" \
            GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" \
            go run buildscripts/gen-ldflags.go "${VERSION}")"
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          ASSET="minio.${TAG}.${GOOS}-${GOARCH}${EXT}"
          go build -tags kqueue -trimpath --ldflags "${LDFLAGS}" -o "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256sum"
          if [ "${GOOS}" = "linux" ] && [ "${GOARCH}" = "amd64" ]; then
            ./"${ASSET}" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: minio-${{ matrix.goos }}-${{ matrix.goarch }}
          path: minio.${{ needs.version.outputs.tag }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag

  docker:
    name: Publish container image
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve commit time
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_TIME=${{ steps.commit.outputs.time }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
